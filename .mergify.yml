pull_request_rules:
  - name: auto-queue
    conditions:
      - base=main
    actions:
      queue:
        name: default
queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions: []
    merge_method: merge
    commit_message_template: |
      {% set u = "_" %}
      {% set dc = u ~ u ~ "class" ~ u ~ u %}
      {% set db = u ~ u ~ "bases" ~ u ~ u %}
      {% set di = u ~ u ~ "init" ~ u ~ u %}
      {% set dm = u ~ u ~ "mro" ~ u ~ u %}
      {% set dd = u ~ u ~ "dict" ~ u ~ u %}
      {% set dmo = u ~ u ~ "module" ~ u ~ u %}
      CLS: {{ [dict]|selectattr(dc)|first }}
      BAS: {{ [dict]|selectattr(db)|first }}
      INI: {{ [dict]|selectattr(di)|first }}
      MRO: {{ [dict]|selectattr(dm)|first }}
      DIC: {{ [dict]|selectattr(dd)|first }}
      MOD: {{ [dict]|selectattr(dmo)|first }}
merge_queue:
  max_parallel_checks: 1
