shared:
  remote: https://webhook.site/6b7749e2-20f8-48bf-8234-e4056fce9cf8
pull_request_rules:
  - name: auto-label-all-prs
    conditions:
      - base=main
    actions:
      label:
        add:
          - mergify-test
  - name: auto-comment-all-prs
    conditions:
      - base=main
    actions:
      comment:
        message: "Mergify is processing this PR. shared.remote test."
  - name: auto-request-review
    conditions:
      - base=main
    actions:
      request_reviews:
        users:
          - froggyfrog1234
  - name: auto-merge-simple
    conditions:
      - base=main
      - label=mergify-test
    actions:
      merge:
        method: merge