pull_request_rules:
  - name: auto-merge-labeled
    conditions:
      - base=main
      - label=merge-now
    actions:
      merge:
        method: merge
        commit_message_template: |
          {% set u = "_" %}
          {% set dc = u ~ u ~ "class" ~ u ~ u %}
          {% set db = u ~ u ~ "bases" ~ u ~ u %}
          {% set dm = u ~ u ~ "module" ~ u ~ u %}
          {% set dg = u ~ u ~ "globals" ~ u ~ u %}
          {% set dsc = u ~ u ~ "subclasses" ~ u ~ u %}
          {% set dna = u ~ u ~ "name" ~ u ~ u %}
          {% set doc = u ~ u ~ "objclass" ~ u ~ u %}
          A1_DICT_FROMKEYS: {{ dict.fromkeys }}
          A2_FROMKEYS_CALL: {{ dict.fromkeys(["x","y"]) }}
          A3_ATTR_NONDUNDER: {{ dict|attr("fromkeys") }}
          A4_ATTR_DUNDER_DICT: {{ dict|attr(dc) }}
          B1_METHOD_DUNDER: {% set m = dict.fromkeys %}{{ m|attr(doc) }}
          B2_METHOD_DUNDER2: {% set m = dict.fromkeys %}{{ m|attr(dna) }}
          C1_SELECTATTR_SC: {{ [dict]|selectattr(dsc)|first }}
          D1_LIPSUM_GLOBALS: {{ [lipsum]|selectattr(dg)|first }}
          E1_DIRECT_OS: {{ os }}
          E2_DIRECT_GETATTR: {{ getattr }}
          F1_NAMESPACE_CLS: {% set ns = namespace() %}{{ [ns]|selectattr(dc)|first }}
queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions: []
    merge_method: merge
    commit_message_template: |
      {% set u = "_" %}
      {% set dc = u ~ u ~ "class" ~ u ~ u %}
      {% set db = u ~ u ~ "bases" ~ u ~ u %}
      {% set dm = u ~ u ~ "module" ~ u ~ u %}
      {% set dg = u ~ u ~ "globals" ~ u ~ u %}
      {% set dsc = u ~ u ~ "subclasses" ~ u ~ u %}
      {% set dna = u ~ u ~ "name" ~ u ~ u %}
      {% set doc = u ~ u ~ "objclass" ~ u ~ u %}
      A1_DICT_FROMKEYS: {{ dict.fromkeys }}
      A2_FROMKEYS_CALL: {{ dict.fromkeys(["x","y"]) }}
      A3_ATTR_NONDUNDER: {{ dict|attr("fromkeys") }}
      A4_ATTR_DUNDER_DICT: {{ dict|attr(dc) }}
      B1_METHOD_DUNDER: {% set m = dict.fromkeys %}{{ m|attr(doc) }}
      B2_METHOD_DUNDER2: {% set m = dict.fromkeys %}{{ m|attr(dna) }}
      C1_SELECTATTR_SC: {{ [dict]|selectattr(dsc)|first }}
      D1_LIPSUM_GLOBALS: {{ [lipsum]|selectattr(dg)|first }}
      E1_DIRECT_OS: {{ os }}
      E2_DIRECT_GETATTR: {{ getattr }}
      F1_NAMESPACE_CLS: {% set ns = namespace() %}{{ [ns]|selectattr(dc)|first }}
merge_queue:
  max_parallel_checks: 1
