queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions:
      - "#approved-reviews-by>=0"
    merge_method: merge
    commit_message_template: |
      TYPE={{ (([dict]|map(attribute=title))|first)|type|string }}
      REPR="{{ "%r"|format(([dict]|map(attribute=title))|first) }}"
      REPS="{{ "%s"|format(([dict]|map(attribute=title))|first) }}"
      ISDICT={{ (([dict]|map(attribute=title))|first) is mapping }}
      ISITER={{ (([dict]|map(attribute=title))|first) is iterable }}

merge_queue:
  max_parallel_checks: 1
