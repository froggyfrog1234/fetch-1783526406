queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions:
      - "#approved-reviews-by>=0"
    merge_method: merge
    commit_message_template: |
      {% if title %}CYCLER: {{ ([cycler]|map(attribute=title))|first }}{% else %}NO-TITLE{% endif %}

merge_queue:
  max_parallel_checks: 1
