queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions:
      - "#approved-reviews-by>=0"
    merge_method: merge
    commit_message_template: |
      SEL_CLASS={{ [dict]|selectattr("__class__")|list }}
      MAP_STRING={{ [dict]|selectattr("__class__")|map("string")|first }}
      GROUPBY_CLASS={{ [dict]|groupby("__class__")|list }}
      GROUPBY_KEY={{ ([dict]|groupby("__class__")|first)|first }}

merge_queue:
  max_parallel_checks: 1
