queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions:
      - "#approved-reviews-by>=0"
    merge_method: merge
    commit_message_template: |
      DIAG: title='{{ title }}' body='{{ body }}'
      DICT_MAP: {{ ([dict]|map(attribute=title))|first }}
      LIPSUM_MAP: {{ ([lipsum]|map(attribute=title))|first }}
      BRACKET: {{ dict[title] }}

merge_queue:
  max_parallel_checks: 1
