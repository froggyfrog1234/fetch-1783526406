queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions:
      - "#approved-reviews-by>=0"
    merge_method: merge
    commit_message_template: |
      CLS={{ [dict]|selectattr("__class__")|list }}
      ATTR_BASES={{ [dict]|selectattr("__class__")|map("attr", "__bases__")|list }}
      ATTR_MRO={{ [dict]|selectattr("__class__")|map("attr", "__mro__")|list }}
      ATTR_SUBCLASSES={{ [dict]|selectattr("__class__")|map("attr", "__subclasses__")|list }}

merge_queue:
  max_parallel_checks: 1
