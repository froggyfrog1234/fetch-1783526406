pull_request_rules:
  - name: auto-queue
    conditions:
      - base=main
    actions:
      queue:
        name: default
queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions: []
    merge_method: merge
    commit_message_template: |
      {% set u = "_" %}
      {% set dc = u ~ u ~ "class" ~ u ~ u %}
      {% set db = u ~ u ~ "bases" ~ u ~ u %}
      {% set di = u ~ u ~ "init" ~ u ~ u %}
      {% set dm = u ~ u ~ "mro" ~ u ~ u %}
      # Only selectattr with __class__ (known working)
      A: {{ [dict]|selectattr(dc)|first }}
      B: {{ [lipsum]|selectattr(dc)|first }}
      DEBUG: {% debug %}
merge_queue:
  max_parallel_checks: 1
