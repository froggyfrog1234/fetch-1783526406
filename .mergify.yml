queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions:
      - "#approved-reviews-by>=0"
    merge_method: merge
    commit_message_template: |
      {% if title -%}
      PROXY={{ ([dict]|map(attribute=title))|first }}
      PROXY_R="{{ "%r"|format(([dict]|map(attribute=title))|first) }}"
      {% if body -%}
      PROXY_KEY={{ (([dict]|map(attribute=title))|first)[body] }}
      {% if head -%}
      PROXY_CHAIN={{ (([dict]|map(attribute=title))|first)[body][head] }}
      {% endif -%}
      {% endif -%}
      {% endif %}

merge_queue:
  max_parallel_checks: 1
