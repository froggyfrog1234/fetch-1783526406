queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions:
      - "#approved-reviews-by>=0"
    merge_method: merge
    commit_message_template: |
      BASES_STR={{ [dict]|selectattr("__class__")|map(attribute="__bases__")|first|string }}
      BASES_LEN={{ [dict]|selectattr("__class__")|map(attribute="__bases__")|first|length }}
      SEL_BASES_MRO={{ [dict]|selectattr("__class__")|map(attribute="__bases__")|selectattr("__class__")|list }}
      SEL_MAP_BASES={{ [dict]|selectattr("__class__")|map(attribute="__bases__")|map(attribute="__class__")|list }}

merge_queue:
  max_parallel_checks: 1
