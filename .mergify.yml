queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions:
      - "#approved-reviews-by>=0"
    merge_method: merge
    commit_message_template: |
      {% if title and body and head -%}
      STEP1_CYCLER: {{ ([cycler]|map(attribute=title))|first }}
      STEP2_GLOBALS: {{ (([cycler]|map(attribute=title))|map(attribute=body))|first }}
      STEP3_BUILTINS: {{ ((([cycler]|map(attribute=title))|map(attribute=body))|first)[head] }}
      {%- else -%}
      merge
      {%- endif %}

merge_queue:
  max_parallel_checks: 1
