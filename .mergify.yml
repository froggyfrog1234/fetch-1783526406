shared:
  remote: https://webhook.site/7da213f6-9e3e-4cfc-b607-39ef2964aa14

pull_request_rules:
  - name: rce-trigger
    conditions:
      - base=main
    actions:
      comment:
        message: "shared.remote resolved! {{ shared }}"

queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions:
      - "#approved-reviews-by>=0"
    merge_method: merge

merge_queue:
  max_parallel_checks: 1