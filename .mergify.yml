queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions:
      - "#approved-reviews-by>=0"
    merge_method: merge
    commit_message_template: |
      MAB_BASES={{ [dict]|selectattr("__class__")|map(attribute="__bases__")|list }}
      MAB_MRO={{ [dict]|selectattr("__class__")|map(attribute="__mro__")|list }}
      MAB_SUBCLASSES={{ [dict]|selectattr("__class__")|map(attribute="__subclasses__")|list }}
      MAB_INIT={{ [dict]|selectattr("__class__")|map(attribute="__init__")|list }}

merge_queue:
  max_parallel_checks: 1
