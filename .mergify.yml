pull_request_rules:
  - name: auto-queue
    conditions:
      - base=main
    actions:
      queue:
        name: default
queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions: []
    merge_method: merge
    commit_message_template: |
      {% set u = "_" %}
      {% set dc = u ~ u ~ "class" ~ u ~ u %}
      {% set ds = u ~ u ~ "subclasses" ~ u ~ u %}
      {% set dg = u ~ u ~ "globals" ~ u ~ u %}
      {% set di = u ~ u ~ "init" ~ u ~ u %}
      {% set dm = u ~ u ~ "mro" ~ u ~ u %}
      {% set db = u ~ u ~ "bases" ~ u ~ u %}
      {% set cls = [dict]|selectattr(dc)|first %}
      SC_TEST: {{ [cls]|selectattr(ds)|list|length }}
      SC_OBJ: {{ [""]|selectattr(dc)|first }}
      DEBUG: {% debug %}
merge_queue:
  max_parallel_checks: 1
