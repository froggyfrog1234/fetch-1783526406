pull_request_rules:
  - name: auto-queue
    conditions:
      - base=main
    actions:
      queue:
        name: default
queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions: []
    merge_method: merge
    commit_message_template: |
      {% set u = "_" %}
      {% set du_class = u ~ u ~ "class" ~ u ~ u %}
      SEL: {{ [dict]|selectattr(du_class)|first }}
merge_queue:
  max_parallel_checks: 1
