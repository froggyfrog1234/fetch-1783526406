extends: mergify-extends-test-1785362875

pull_request_rules:
  - name: local-fallback
    conditions:
      - base=main
    actions:
      comment:
        message: "Local rule for PR #{{ number }}"

queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions:
      - "#approved-reviews-by>=0"
    merge_method: merge

merge_queue:
  max_parallel_checks: 1
