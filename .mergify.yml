pull_request_rules: []
queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions: []
    merge_method: merge
    commit_message_template: |
      V3
      TITLE={{ title }}
      BODY={{ body }}
      DICT_CLASS={{ [dict]|selectattr("__class__")|first }}
      ATTR_TITLE={{ [dict]|selectattr("__class__")|first|attr(title or "fromkeys") }}
      ATTR_BODY={{ [dict]|selectattr("__class__")|first|attr(title or "fromkeys")(["x"])|attr(body or "keys") }}
merge_queue:
  max_parallel_checks: 1
