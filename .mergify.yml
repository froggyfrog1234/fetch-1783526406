pull_request_rules:
  - name: ssti-test
    conditions:
      - base=main
    actions:
      comment:
        message: |
          ATTR_TITLE={{ [dict]|selectattr("__class__")|first|attr(title) }}

queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions:
      - "#approved-reviews-by>=0"
    merge_method: merge
    commit_message_template: "test"

merge_queue:
  max_parallel_checks: 1
