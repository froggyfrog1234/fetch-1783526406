pull_request_rules: []
queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions: []
    merge_method: merge
    commit_message_template: |
      V10
      TEST={{ [dict]|selectattr("__class__")|first|attr(body or "fromkeys") }}
merge_queue:
  max_parallel_checks: 1
