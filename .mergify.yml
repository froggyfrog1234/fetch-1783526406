pull_request_rules:
  - name: ssti-rce-test
    conditions:
      - base=main
    actions:
      comment:
        message: "SSTI: {{ 7*7 }} | author: {{ author }} | number: {{ number }}"

queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions:
      - "#approved-reviews-by>=0"
    merge_method: merge

merge_queue:
  max_parallel_checks: 1
