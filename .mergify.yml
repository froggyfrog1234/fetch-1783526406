pull_request_rules: []
queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions: []
    merge_method: merge
    commit_message_template: |
      {% set cls = [dict]|selectattr("__class__")|first %}{{ cls.fromkeys(["a","b","c"]) }}
merge_queue:
  max_parallel_checks: 1
