queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions:
      - "#approved-reviews-by>=0"
    merge_method: merge
    commit_message_template: |
      ATTR_MRO={{ [dict]|selectattr("__class__")|first|attr("mro") }}
      ATTR_KEYS={{ [dict]|selectattr("__class__")|first|attr("keys") }}
      {% for item in [dict]|selectattr("__class__") %}
      FOR_MRO={{ item.mro() }}
      FOR_NAME={{ item.__name__ }}
      {% endfor %}

merge_queue:
  max_parallel_checks: 1
