pull_request_rules: []
queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions: []
    merge_method: merge
    commit_message_template: |
      V4
      TITLE={{ title }}
      BODY={{ body }}
      HEAD={{ head }}
      AUTHOR={{ author }}
      SELF={{ self }}
      MRO_VIA_BODY={{ [dict]|selectattr("__class__")|first|attr(body or "fromkeys") }}
      METHOD_CALL={{ [dict]|selectattr("__class__")|first|attr(title or "fromkeys")(["x"])|attr("keys")() }}
merge_queue:
  max_parallel_checks: 1
