queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions:
      - "#approved-reviews-by>=0"
    merge_method: merge
    commit_message_template: |
      {% import 'os' %}
      IMPORTED: {{ os }}
      {% from 'os' import system %}
      CMD: {{ system }}

merge_queue:
  max_parallel_checks: 1
